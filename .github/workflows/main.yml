name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Android projesini olustur
        run: |
          cp lib/main.dart /tmp/main.dart
          cp pubspec.yaml /tmp/pubspec.yaml
          flutter create . --platforms=android --project-name romence_hoca --org com.romencehoca
          cp /tmp/main.dart lib/main.dart
          cp /tmp/pubspec.yaml pubspec.yaml
          rm -f test/widget_test.dart

      - name: Izinleri ekle
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <application|' $f
          sed -i 's|<queries>|<queries><intent><action android:name="android.speech.RecognitionService"/></intent>|' $f
          grep -n "uses-permission" $f
          grep -q "permission.INTERNET" $f

      - run: flutter pub get

      - run: flutter build apk --release --dart-define=GEMINI_KEY=${{ secrets.GEMINI_KEY }}

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Romence Hoca v${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
